<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PushTrack</title>
    <meta name="description" content="Daily pushup tracker with monthly goals, streaks, and smart progress tracking." />
    <meta name="theme-color" content="#0F1117" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Barlow+Condensed:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Prevent OS emoji font from hijacking digit 0 */
      @font-face {
        font-family: 'SyneNoEmoji';
        src: local('Syne');
        unicode-range: U+0030-0039, U+002C, U+002E;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
